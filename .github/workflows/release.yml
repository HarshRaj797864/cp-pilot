name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level so the publish steps can check whether each token is configured.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check-types
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VSIX=cp-pilot-$version.vsix" >> "$GITHUB_ENV"

      - name: Package
        run: npx vsce package --out "$VSIX"

      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "$VSIX"

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish "$VSIX" --pat "$OVSX_PAT"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.VSIX }}
          generate_release_notes: true
          prerelease: true
