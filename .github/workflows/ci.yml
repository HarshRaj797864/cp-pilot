name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check-types
      - run: npm test
      - run: npx vsce package --out cp-pilot.vsix

      - uses: actions/upload-artifact@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          name: cp-pilot-vsix
          path: cp-pilot.vsix
